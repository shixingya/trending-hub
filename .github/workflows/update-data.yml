name: Update Trending Data

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'src/**'

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: Fetch trending data
        run: npx tsx src/fetch-docs.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/trending.json
          git diff --staged --quiet || git commit -m "chore: update trending data"
          git push
