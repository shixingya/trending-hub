<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Hub - 全网热点聚合</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 2rem;
      text-align: center;
      border-bottom: 1px solid #333;
    }
    header h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    header p { color: #888; font-size: 0.9rem; }
    header .links { margin-top: 0.75rem; }
    header .links a {
      color: #48dbfb;
      text-decoration: none;
      font-size: 0.85rem;
      margin: 0 0.5rem;
    }
    header .links a:hover { text-decoration: underline; }
    .tabs {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 2rem;
      overflow-x: auto;
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      flex-wrap: wrap;
    }
    .tab {
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      border: 1px solid #444;
      background: #222;
      color: #ccc;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .tab:hover { border-color: #666; }
    .tab.active { background: #333; border-color: #888; color: #fff; }
    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .source-section {
      background: #1a1a1a;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      border: 1px solid #2a2a2a;
      overflow: hidden;
    }
    .source-header {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid #2a2a2a;
    }
    .source-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.9rem;
      color: #fff;
    }
    .source-name { font-weight: 600; font-size: 1rem; }
    .source-count { color: #666; font-size: 0.8rem; margin-left: 0.5rem; }
    .source-error { color: #ff6b6b; font-size: 0.85rem; margin-left: auto; }
    .item-list { list-style: none; }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #1f1f1f;
      transition: background 0.15s;
    }
    .item:hover { background: #222; }
    .item:last-child { border-bottom: none; }
    .item-rank {
      min-width: 24px;
      height: 24px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 600;
      background: #333;
      color: #888;
    }
    .item:nth-child(-n+3) .item-rank { background: #ff6b6b; color: #fff; }
    .item-content { flex: 1; min-width: 0; }
    .item-title {
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .item-title a { color: #e0e0e0; text-decoration: none; }
    .item-title a:hover { color: #48dbfb; }
    .item-desc {
      font-size: 0.8rem;
      color: #666;
      margin-top: 0.25rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .item-hot {
      font-size: 0.75rem;
      color: #ff6b6b;
      white-space: nowrap;
    }
    .loading {
      text-align: center;
      padding: 3rem;
      color: #666;
    }
    .loading::after {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid #444;
      border-top-color: #48dbfb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-left: 0.5rem;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .refresh-time {
      text-align: center;
      color: #555;
      font-size: 0.8rem;
      padding: 1rem;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 1.5rem; }
      .tabs { padding: 0.75rem 1rem; }
      .item { padding: 0.6rem 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Trending Hub</h1>
    <p>全网热点聚合 - 百度 / B站 / 抖音 / 头条</p>
    <div class="links">
      <a href="https://github.com/shixingya/trending-hub">GitHub</a>
    </div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="container" id="content">
    <div class="loading">正在加载热点数据</div>
  </div>
  <div class="refresh-time" id="refreshTime"></div>

  <script>
    let allData = [];
    let activeSource = 'all';

    async function loadTrending() {
      try {
        const res = await fetch('data/trending.json?t=' + Date.now());
        allData = await res.json();
        renderTabs();
        renderContent();
      } catch (err) {
        document.getElementById('content').innerHTML =
          '<div class="source-section"><div class="source-header"><span class="source-error">加载失败，数据可能尚未生成。GitHub Actions 每2小时自动更新一次。</span></div></div>';
      }
    }

    function renderTabs() {
      const tabs = document.getElementById('tabs');
      let html = '<div class="tab active" data-key="all">全部</div>';
      for (const source of allData) {
        html += `<div class="tab" data-key="${source.key}">${source.icon} ${source.source}</div>`;
      }
      tabs.innerHTML = html;
      tabs.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          activeSource = tab.dataset.key;
          renderContent();
        });
      });
    }

    function renderContent() {
      const container = document.getElementById('content');
      const sources = activeSource === 'all'
        ? allData
        : allData.filter(s => s.key === activeSource);

      let html = '';
      for (const source of sources) {
        html += `<div class="source-section">
          <div class="source-header">
            <div class="source-icon" style="background:${source.color}">${source.icon}</div>
            <span class="source-name">${source.source}</span>
            <span class="source-count">${source.items.length} 条</span>
            ${source.error ? `<span class="source-error">${source.error}</span>` : ''}
          </div>`;
        if (source.items.length > 0) {
          html += '<ul class="item-list">';
          const maxItems = Math.min(source.items.length, 30);
          for (let i = 0; i < maxItems; i++) {
            const item = source.items[i];
            html += `<li class="item">
              <span class="item-rank">${i + 1}</span>
              <div class="item-content">
                <div class="item-title"><a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a></div>
                ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ''}
              </div>
              ${item.hot ? `<span class="item-hot">${formatHot(item.hot)}</span>` : ''}
            </li>`;
          }
          html += '</ul>';
        }
        html += '</div>';
      }
      container.innerHTML = html || '<div class="loading">暂无数据</div>';

      const latestFetch = allData.find(s => s.fetchedAt);
      if (latestFetch) {
        document.getElementById('refreshTime').textContent =
          `数据更新于 ${new Date(latestFetch.fetchedAt).toLocaleString('zh-CN')}`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function formatHot(num) {
      if (num >= 10000) return (num / 10000).toFixed(1) + '万';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return String(num);
    }

    loadTrending();
  </script>
</body>
</html>
