    function categorize(title) {
      for (const [key, cat] of Object.entries(categories)) {
        for (const kw of cat.keywords) {
          if (title.includes(kw)) return key;
        }
      }
      return 'other';
    }

    function toggleTheme() {
      const body = document.documentElement;
      const btn = document.getElementById('themeToggle');
      if (body.getAttribute('data-theme') === 'light') {
        body.removeAttribute('data-theme');
        btn.textContent = 'Light';
        localStorage.setItem('theme', 'dark');
      } else {
        body.setAttribute('data-theme', 'light');
        btn.textContent = 'Dark';
        localStorage.setItem('theme', 'light');
      }
    }

    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      document.getElementById('themeToggle').textContent = 'Dark';
    } else if (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: light)').matches) {
      document.documentElement.setAttribute('data-theme', 'light');
      document.getElementById('themeToggle').textContent = 'Dark';
    }

    function onSearch(query) {
      searchQuery = query.trim().toLowerCase();
      renderContent();
    }

    async function loadTrending() {
      try {
        const res = await fetch('data/trending.json?t=' + Date.now());
        allData = await res.json();
        prevTitleSet = null;
        try {
          const prevRes = await fetch('data/trending-prev.json?t=' + Date.now());
          prevData = await prevRes.json();
        } catch { prevData = []; }
        renderTabs();
        renderStats();
        renderContent();
      } catch (err) {
        document.getElementById('content').innerHTML =
          '<div class="source-section"><div class="source-header"><span class="source-error">加载失败，数据可能尚未生成。GitHub Actions 每2小时自动更新一次。</span></div></div>';
      }
    }

    function renderStats() {
      const total = allData.reduce((sum, s) => sum + s.items.length, 0);
      const successCount = allData.filter(s => !s.error && s.items.length > 0).length;
      const errorCount = allData.filter(s => s.error || s.items.length === 0).length;
      let newCount = 0;
      if (prevData.length > 0) {
        const ps = buildPrevTitleSet();
        for (const source of allData) {
          for (const item of source.items) {
            if (!ps.has(item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase())) newCount++;
          }
        }
      }
      const bar = document.getElementById('statsBar');
      let html = `<span class="stats-status">
        <span class="stats-status-dot success"></span>
        <span>${successCount} 正常</span>
      </span>`;
      if (errorCount > 0) {
        html += `<span class="stats-status">
          <span class="stats-status-dot error"></span>
          <span>${errorCount} 异常</span>
        </span>`;
      }
      html += `<span>${t('platformsCount')} ${allData.length}</span><span>${total} ${t('hotTopics')}</span>`;
      if (newCount > 0) html += `<span style="color:var(--accent-red)">${newCount} ${t('newItems')}</span>`;
      bar.innerHTML = html;
    }

      const tabs = document.getElementById('tabs');

    function highlightText(text, query) {
      if (!query || !text) return escapeHtml(text);
      const escaped = escapeHtml(text);
      const queryEscaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${queryEscaped})`, 'gi');
      return escaped.replace(regex, '<mark class="search-highlight">$1</mark>');
    }

    function findRelatedTopics(title, limit = 8) {
      const words = title.toLowerCase().split(/[\s,，。！？、]+/).filter(w => w.length >= 2);
      if (words.length === 0) return [];

      const scores = new Map();
      for (const source of allData) {
        for (const item of source.items) {
          const itemTitle = item.title.toLowerCase();
          let score = 0;
          for (const word of words) {
            if (itemTitle.includes(word)) score += word.length;
          }
          if (score > 0) {
            const normalized = item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
            const titleNorm = title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
            if (normalized === titleNorm) continue;
            scores.set(item, { score, source });
          }
        }
      }

      return Array.from(scores.entries())
        .sort((a, b) => b[1].score - a[1].score)
        .slice(0, limit)
        .map(([item, data]) => ({ ...item, sourceName: data.source.source, sourceIcon: data.source.icon, sourceColor: data.source.color, relevanceScore: data.score }));
    }

    function filterItems(items) {
      let filtered = items;
      if (activeCategory !== 'all') {
        filtered = filtered.filter(item => categorize(item.title) === activeCategory);
      }
      if (searchQuery) {
        filtered = filtered.filter(item =>
          item.title.toLowerCase().includes(searchQuery) ||
          (item.description && item.description.toLowerCase().includes(searchQuery))
        );
      }
      return filtered;
    }

    function findCrossPlatformTopics() {
      const titleMap = {};
      const normalizedMap = {};
      
      for (const source of allData) {
        for (const item of source.items) {
          const normalized = item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
          if (normalized.length < 6) continue;
          
          let matched = false;
          
          for (const key of Object.keys(titleMap)) {
            const existing = titleMap[key];
            const existingNorm = key;
            
            if (existingNorm === normalized) {
              if (!existing.sources.includes(source.source)) {
                existing.sources.push(source.source);
                existing.urls[source.key] = item.url;
                if (item.hot > (existing.maxHot || 0)) existing.maxHot = item.hot;
              }
              matched = true;
              break;
            }
            
            if (existingNorm.length >= 8 && normalized.length >= 8) {
              if (existingNorm.includes(normalized) || normalized.includes(existingNorm)) {
                if (!existing.sources.includes(source.source)) {
                  existing.sources.push(source.source);
                  existing.urls[source.key] = item.url;
                  if (item.hot > (existing.maxHot || 0)) existing.maxHot = item.hot;
                }
                matched = true;
                break;
              }
              
              const overlap = calculateOverlap(existingNorm, normalized);
              if (overlap > 0.7) {
                if (!existing.sources.includes(source.source)) {
                  existing.sources.push(source.source);
                  existing.urls[source.key] = item.url;
                  if (item.hot > (existing.maxHot || 0)) existing.maxHot = item.hot;
                }
                matched = true;
                break;
              }
            }
          }
          
          if (!matched) {
            titleMap[normalized] = { title: item.title, sources: [], urls: {}, maxHot: 0 };
            titleMap[normalized].sources.push(source.source);
            titleMap[normalized].urls[source.key] = item.url;
            if (item.hot > (titleMap[normalized].maxHot || 0)) titleMap[normalized].maxHot = item.hot;
          }
        }
      }
      return Object.values(titleMap)
        .filter(t => t.sources.length >= 2)
        .sort((a, b) => (b.maxHot || 0) - (a.maxHot || 0))
        .slice(0, 10);
    }
    
    function calculateOverlap(str1, str2) {
      const words1 = new Set(str1.match(/[\u4e00-\u9fff]{2,}|[a-z0-9]+/gi) || []);
      const words2 = new Set(str2.match(/[\u4e00-\u9fff]{2,}|[a-z0-9]+/gi) || []);
      if (words1.size === 0 || words2.size === 0) return 0;
      let common = 0;
      for (const w of words1) {
        if (words2.has(w)) common++;
      }
      return (common * 2) / (words1.size + words2.size);
    }

    function getTopHotTopics() {
      const all = [];
      for (const source of allData) {
        for (const item of source.items) {
          if (item.hot) all.push({ ...item, sourceName: source.source, sourceIcon: source.icon, sourceColor: source.color, sourceKey: source.key });
        }
      }
      return all.sort((a, b) => (b.hot || 0) - (a.hot || 0)).slice(0, 20);
    }

    function getDailyPicks() {
      const topicMap = {};
      
      for (const source of allData) {
        for (const item of source.items) {
          const normalized = item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
          if (normalized.length < 6) continue;
          
          let matched = false;
          
          for (const key of Object.keys(topicMap)) {
            const existing = topicMap[key];
            
            if (key === normalized) {
              if (!existing.sources.includes(source.source)) {
                existing.sources.push(source.source);
                existing.totalHot += item.hot || 0;
                if (item.description && existing.descriptions.length < 2) {
                  existing.descriptions.push(item.description);
                }
              }
              matched = true;
              break;
            }
            
            if (key.length >= 8 && normalized.length >= 8) {
              if (key.includes(normalized) || normalized.includes(key)) {
                if (!existing.sources.includes(source.source)) {
                  existing.sources.push(source.source);
                  existing.totalHot += item.hot || 0;
                  if (item.description && existing.descriptions.length < 2) {
                    existing.descriptions.push(item.description);
                  }
                }
                matched = true;
                break;
              }
              
              const overlap = calculateOverlap(key, normalized);
              if (overlap > 0.7) {
                if (!existing.sources.includes(source.source)) {
                  existing.sources.push(source.source);
                  existing.totalHot += item.hot || 0;
                  if (item.description && existing.descriptions.length < 2) {
                    existing.descriptions.push(item.description);
                  }
                }
                matched = true;
                break;
              }
            }
          }
          
          if (!matched) {
            topicMap[normalized] = {
              title: item.title,
              url: item.url,
              sources: [],
              totalHot: 0,
              maxRank: 999,
              descriptions: []
            };
            topicMap[normalized].sources.push(source.source);
            topicMap[normalized].totalHot += item.hot || 0;
            if (item.description && topicMap[normalized].descriptions.length < 2) {
              topicMap[normalized].descriptions.push(item.description);
            }
          }
        }
      }
      return Object.values(topicMap)
        .map(t => ({
          ...t,
          score: t.sources.length * 1000 + (t.totalHot || 0) / 10000
        }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);
    }

    function showTopicDetail(title) {
      const normalized = title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
      const matches = [];
      for (const source of allData) {
        for (const item of source.items) {
          const itemNorm = item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
          if (itemNorm === normalized || (normalized.length >= 6 && itemNorm.includes(normalized)) || (itemNorm.length >= 6 && normalized.includes(itemNorm))) {
            matches.push({ source: source.source, key: source.key, icon: source.icon, color: source.color, title: item.title, url: item.url, hot: item.hot, description: item.description, comments: item.comments });
          }
        }
      }
      const modal = document.getElementById('topicModal');
      document.getElementById('modalTitle').textContent = title;
      let body = '';
      if (matches.length <= 1) {
        body = `<div class="modal-section"><div class="modal-section-title">${t('topicDetailSingle')}</div>`;
        if (matches.length === 1) {
          const m = matches[0];
          body += `<div class="modal-platform-item">

            <span class="item-source-tag" style="background:${item.sourceColor};color:#fff;font-size:0.6rem">${item.sourceIcon}</span>

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (focusMode) { toggleFocusMode(); return; }
        closeModal();
      }

    function formatHot(num) {
      if (num >= 10000) return (num / 10000).toFixed(1) + '万';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return String(num);
    }

    function formatComments(num) {
      if (num >= 10000) return (num / 10000).toFixed(1) + '万';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return String(num);
    }

    function buildPrevTitleSet() {
      const set = new Set();
      for (const source of prevData) {
        for (const item of source.items) {
          set.add(item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase());
        }
      }
      return set;
    }

    let prevTitleSet = null;
    function isNew(title) {
      if (!prevTitleSet && prevData.length > 0) prevTitleSet = buildPrevTitleSet();
      if (!prevTitleSet) return false;
      return !prevTitleSet.has(title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase());
    }

    function relativeTime(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return t('justNow');
      if (mins < 60) return `${mins} ${t('minutesAgo')}`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours} ${t('hoursAgo')}`;
      return `${Math.floor(hours / 24)} ${t('daysAgo')}`;
    }

    function updateRefreshTime() {
      const latestFetch = allData.find(s => s.fetchedAt);
      if (latestFetch) {
        document.getElementById('refreshTime').textContent =
          `数据更新于 ${relativeTime(latestFetch.fetchedAt)}`;
      }
    }

    loadTrending();
    setInterval(() => loadTrending(), 10 * 60 * 1000);
    setInterval(() => updateRefreshTime(), 60 * 1000);

    if (currentLang === 'en') {
      updateUILanguage();
    }

    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;
      const minSwipe = 100;

      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > minSwipe) {
        if (diffX > 0) {
          navigatePlatform('prev');
        } else {
          navigatePlatform('next');
        }
      } else if (diffY > minSwipe && Math.abs(diffY) > Math.abs(diffX)) {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function navigatePlatform(direction) {
      const platformKeys = ['all', ...allData.map(s => s.key)];
      const currentIndex = platformKeys.indexOf(activeSource);
      let newIndex;

      if (direction === 'prev') {
        newIndex = currentIndex > 0 ? currentIndex - 1 : platformKeys.length - 1;
      } else {
        newIndex = currentIndex < platformKeys.length - 1 ? currentIndex + 1 : 0;
      }

      switchSource(platformKeys[newIndex]);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape') {
        document.getElementById('searchInput').blur();
      }
      if ((e.key === 'j' || e.key === 'k') && document.activeElement.tagName !== 'INPUT') {
        const links = Array.from(document.querySelectorAll('.item-title a'));
        if (links.length === 0) return;
        const current = document.activeElement.closest('.item');
        let idx = current ? links.indexOf(current.querySelector('a')) : -1;
        if (e.key === 'j') idx = Math.min(idx + 1, links.length - 1);
        else idx = Math.max(idx - 1, 0);
        links[idx].focus();
        links[idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    });

    window.addEventListener('scroll', () => {
      document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 400);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    function shareSite() {
      const total = allData.reduce((sum, s) => sum + s.items.length, 0);
      const text = `🔥 全网热点聚合 - ${total} 条热点\n\n` +
        allData.filter(s => s.items.length > 0).slice(0, 5).map(s =>
          `${s.source} TOP3:\n${s.items.slice(0, 3).map((item, i) => `  ${i + 1}. ${item.title}`).join('\n')}`
        ).join('\n\n') +
        `\n\n查看更多: ${location.href}`;
      if (navigator.share) {
        navigator.share({ title: 'Trending Hub - 全网热点聚合', text, url: location.href });
      } else {
        navigator.clipboard.writeText(text).then(() => {
          const btns = document.querySelectorAll('.share-btn');
          const btn = btns[btns.length - 1];
          if (btn) { const orig = btn.textContent; btn.textContent = '✓ 已复制'; setTimeout(() => btn.textContent = orig, 2000); }
        });
      }
    }

    function randomTopic() {
      if (allData.length === 0) return;
      const sources = allData.filter(s => s.items.length > 0);
      const source = sources[Math.floor(Math.random() * sources.length)];
      const item = source.items[Math.floor(Math.random() * source.items.length)];
      if (item && item.url) window.open(item.url, '_blank');
    }

    function exportData(format) {
      if (allData.length === 0) return;
      const date = new Date().toISOString().split('T')[0];
      let content = '';
      let filename = '';
      let mimeType = '';

      if (format === 'md') {
        filename = `trending-${date}.md`;
        mimeType = 'text/markdown';
        content = `# 全网热点聚合 - ${date}\n\n`;
        content += `> 生成时间: ${new Date().toLocaleString('zh-CN')}\n\n`;
        for (const source of allData) {
          if (source.items.length === 0) continue;
          content += `## ${source.source} (${source.items.length} 条)\n\n`;
          source.items.slice(0, 20).forEach((item, i) => {
            content += `${i + 1}. [${item.title}](${item.url})`;
            if (item.hot) content += ` - ${formatHot(item.hot)}`;
            content += '\n';
          });
          content += '\n';
        }
      } else if (format === 'csv') {
        filename = `trending-${date}.csv`;
        mimeType = 'text/csv';
        content = '\uFEFF平台,排名,标题,链接,热度\n';
        for (const source of allData) {
          if (source.items.length === 0) continue;
          source.items.slice(0, 20).forEach((item, i) => {
            const title = `"${(item.title || '').replace(/"/g, '""')}"`;
            const url = `"${(item.url || '').replace(/"/g, '""')}"`;
            const hot = item.hot || '';
            content += `${source.source},${i + 1},${title},${url},${hot}\n`;
          });
        }
      }

      const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        const btn = event.target;
        const orig = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    function getBookmarks() {
      try {
        return JSON.parse(localStorage.getItem('trending-bookmarks') || '[]');
      } catch { return []; }
    }

    function toggleBookmark(title, url) {
      const bookmarks = getBookmarks();
      const idx = bookmarks.findIndex(b => b.title === title);
      const btn = event.target;
      if (idx >= 0) {
        bookmarks.splice(idx, 1);
        btn.textContent = '☆';
        btn.style.color = '';
      } else {
        bookmarks.push({ title, url, time: Date.now() });
        btn.textContent = '★';
        btn.style.color = 'var(--accent-yellow)';
      }
      localStorage.setItem('trending-bookmarks', JSON.stringify(bookmarks));
    }

    function sortSource(key) {
      const source = allData.find(s => s.key === key);
      if (!source) return;
      if (sortedSources.has(key)) {
        sortedSources.delete(key);
      } else {
        sortedSources.add(key);
        source.items.sort((a, b) => (b.hot || 0) - (a.hot || 0));
      }
      renderContent();
      const btn = document.querySelector(`[data-source-key="${key}"] .sort-toggle`);
      if (btn) btn.classList.toggle('active', sortedSources.has(key));
    }

    function expandSource(key) {
      expandedSources.add(key);
      renderContent();
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === '/') { e.preventDefault(); document.querySelector('.search-bar input')?.focus(); }
      if (e.key === 't' || e.key === 'T') { toggleTheme(); }
      if (e.key === '0') { switchSource('all'); }
      if (e.key === 'Escape') { closeModal(); closeShortcuts(); }
      if (e.key === '?') { showShortcuts(); }
      if (e.key === 'f' || e.key === 'F') { toggleFocusMode(); }
      if (e.key === 'r' || e.key === 'R') { randomTopic(); }
      if (e.key === 'b' || e.key === 'B') { switchSource('bookmarks'); }
    });

    let focusMode = false;
    function toggleFocusMode() {
      focusMode = !focusMode;
      document.body.classList.toggle('focus-mode', focusMode);
      const btn = document.getElementById('focusBtn');
      if (btn) btn.textContent = focusMode ? '退出' : '专注';
      if (focusMode) {
        const sections = document.querySelectorAll('.source-section');
        sections.forEach(s => s.classList.remove('focus-active'));
        const firstVisible = document.querySelector('.source-section');
        if (firstVisible) firstVisible.classList.add('focus-active');
      }
    }

    document.addEventListener('click', (e) => {
      if (focusMode && e.target.closest('body::before')) {
        toggleFocusMode();
      }
    });

    function mobileNavAction(action, btn) {
      document.querySelectorAll('.mobile-nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      switch(action) {
        case 'home':
          window.scrollTo({ top: 0, behavior: 'smooth' });
          switchSource('all');
          break;
        case 'search':
          document.getElementById('searchInput').focus();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        case 'brief':
          showMorningBrief();
          break;
        case 'random':
          randomTopic();
          break;
        case 'theme':
          toggleTheme();
          break;
      }
      
      setTimeout(() => {
        document.querySelectorAll('.mobile-nav-item').forEach(b => b.classList.remove('active'));
        if (action === 'home') {
          document.querySelector('.mobile-nav-item').classList.add('active');
        }
      }, 300);
    }

    function switchSource(key) {
      activeSource = key;
      activeCategory = 'all';
      const tabs = document.getElementById('tabs');
      tabs.querySelectorAll('.tab[data-type="source"]').forEach(t => t.classList.remove('active'));
      const targetTab = tabs.querySelector(`.tab[data-type="source"][data-key="${key}"]`);
      if (targetTab) targetTab.classList.add('active');
      renderContent();
    }

    function generateShareImage() {
      if (allData.length === 0) return;
      const canvas = document.getElementById('shareCanvas');
      const ctx = canvas.getContext('2d');
      const width = 800;
      const height = 1200;
      canvas.width = width;
      canvas.height = height;

      const gradient = ctx.createLinearGradient(0, 0, width, height);
      gradient.addColorStop(0, '#1a1a2e');
      gradient.addColorStop(0.5, '#16213e');
      gradient.addColorStop(1, '#0f3460');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 48px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Trending Hub', width / 2, 80);

      ctx.font = '24px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      const now = new Date();
      const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      ctx.fillText(`全网热点 · ${dateStr}`, width / 2, 120);

      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(100, 150);
      ctx.lineTo(width - 100, 150);
      ctx.stroke();

      const picks = getDailyPicks().slice(0, 5);
      let y = 200;

      if (picks.length > 0) {
        ctx.fillStyle = '#feca57';
        ctx.font = 'bold 28px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('🔥 全网必看', 60, y);
        y += 40;

        picks.forEach((item, i) => {
          ctx.fillStyle = i < 3 ? '#ff6b6b' : '#48dbfb';
          ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
          ctx.fillText(`${i + 1}`, 60, y);

          ctx.fillStyle = '#ffffff';
          ctx.font = '22px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
          const title = item.title.length > 35 ? item.title.substring(0, 35) + '...' : item.title;
          ctx.fillText(title, 100, y);

          ctx.fillStyle = 'rgba(255,255,255,0.6)';
          ctx.font = '16px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
          ctx.fillText(`${item.sources.length} 平台`, width - 150, y);

          y += 45;
        });
      }

      y += 20;
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath();
      ctx.moveTo(60, y);
      ctx.lineTo(width - 60, y);
      ctx.stroke();
      y += 30;

      ctx.fillStyle = '#48dbfb';
      ctx.font = 'bold 28px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('📊 各平台 TOP 1', 60, y);
      y += 40;

      const topSources = allData.filter(s => s.items.length > 0).slice(0, 8);
      topSources.forEach(source => {
        if (y > height - 200) return;

        ctx.fillStyle = source.color;
        ctx.fillRect(60, y - 20, 30, 30);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(source.icon, 75, y);

        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff';
        ctx.font = '18px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
        ctx.fillText(source.source, 100, y);

        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.font = '16px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
        const topTitle = source.items[0]?.title || '';
        const displayTitle = topTitle.length > 30 ? topTitle.substring(0, 30) + '...' : topTitle;
        ctx.fillText(displayTitle, 250, y);

        y += 40;
      });

      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.font = '16px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('扫码查看更多热点 →', width / 2, height - 100);

      const total = allData.reduce((sum, s) => sum + s.items.length, 0);
      ctx.fillText(`${allData.length} 大平台 · ${total} 条热点`, width / 2, height - 70);

      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '14px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
      ctx.fillText('https://shixingya.github.io/trending-hub/', width / 2, height - 40);

      document.getElementById('shareImagePreview').classList.add('active');
    }

    function downloadShareImage() {
      const canvas = document.getElementById('shareCanvas');
      const link = document.createElement('a');
      const date = new Date().toISOString().split('T')[0];
      link.download = `trending-hub-${date}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function closeShareImage() {
      document.getElementById('shareImagePreview').classList.remove('active');
    }

    function showStats() {
      if (allData.length === 0) return;

      const total = allData.reduce((sum, s) => sum + s.items.length, 0);
      const avgPerSource = Math.round(total / allData.length);
      const maxSource = allData.reduce((max, s) => s.items.length > max.items.length ? s : max, allData[0]);

      const categoryCounts = {};
      for (const source of allData) {
        for (const item of source.items) {
          const cat = categorize(item.title);
          categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;
        }
      }

      let body = `
        <div class="stats-grid">
          <div class="stats-card">
            <div class="stats-number">${allData.length}</div>
            <div class="stats-label">${t('statsPlatforms')}</div>
          </div>
          <div class="stats-card">
            <div class="stats-number">${total}</div>
            <div class="stats-label">${t('statsTotal')}</div>
          </div>
          <div class="stats-card">
            <div class="stats-number">${avgPerSource}</div>
            <div class="stats-label">${t('statsAvg')}</div>
          </div>
          <div class="stats-card">
            <div class="stats-number">${maxSource.items.length}</div>
            <div class="stats-label">${maxSource.source} ${t('statsMax')}</div>
          </div>
        </div>

        <div class="stats-card" style="margin-top:1rem">
          <div class="stats-card-title">📊 ${t('statsPlatformChart')}</div>
          <canvas id="platformChart" class="stats-chart"></canvas>
        </div>

        <div class="stats-card" style="margin-top:1rem">
          <div class="stats-card-title">🏷️ ${t('statsCategoryChart')}</div>
          <canvas id="categoryChart" class="stats-chart"></canvas>
        </div>
      `;

      document.getElementById('modalTitle').textContent = t('statsTitle');
      document.getElementById('modalBody').innerHTML = body;
      document.getElementById('topicModal').classList.add('active');

      setTimeout(() => {
        drawPlatformChart();
        drawCategoryChart(categoryCounts);
      }, 100);
    }

    function drawPlatformChart() {
      const canvas = document.getElementById('platformChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.width = canvas.offsetWidth * 2;
      const height = canvas.height = 400;
      canvas.style.height = '200px';

      const sorted = [...allData].sort((a, b) => b.items.length - a.items.length).slice(0, 10);
      const maxVal = Math.max(...sorted.map(s => s.items.length));
      const barWidth = (width - 100) / sorted.length;
      const chartHeight = height - 80;

      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-muted').trim() || '#666';
      ctx.font = '20px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';

      sorted.forEach((source, i) => {
        const barHeight = (source.items.length / maxVal) * chartHeight;
        const x = 50 + i * barWidth;
        const y = height - 40 - barHeight;

        const gradient = ctx.createLinearGradient(x, y, x, height - 40);
        gradient.addColorStop(0, source.color);
        gradient.addColorStop(1, source.color + '80');
        ctx.fillStyle = gradient;
        ctx.fillRect(x + 5, y, barWidth - 10, barHeight);

        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#fff';
        ctx.font = 'bold 18px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
        ctx.fillText(source.items.length, x + barWidth / 2, y - 10);

        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() || '#888';
        ctx.font = '16px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
        const name = source.source.length > 6 ? source.source.substring(0, 6) + '..' : source.source;
        ctx.fillText(name, x + barWidth / 2, height - 15);
      });
    }

    function drawCategoryChart(categoryCounts) {
      const canvas = document.getElementById('categoryChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const width = canvas.width = canvas.offsetWidth * 2;
      const height = canvas.height = 400;
      canvas.style.height = '200px';

      const categories_sorted = Object.entries(categoryCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 8);
      const total = categories_sorted.reduce((sum, [, count]) => sum + count, 0);

      const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#5f27cd', '#00d2d3', '#ff9ff3', '#54a0ff'];
      const centerX = width / 3;
      const centerY = height / 2;
      const radius = Math.min(width, height) / 3;

      let startAngle = -Math.PI / 2;
      categories_sorted.forEach(([cat, count], i) => {
        const sliceAngle = (count / total) * 2 * Math.PI;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();

        startAngle = endAngle;
      });

      ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#fff';
      ctx.font = '20px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'left';

      const legendX = width * 2 / 3;
      let legendY = 60;
      categories_sorted.forEach(([cat, count], i) => {
        const percentage = ((count / total) * 100).toFixed(1);
        const catName = categories[cat]?.name || cat;

        ctx.fillStyle = colors[i % colors.length];
        ctx.fillRect(legendX, legendY - 15, 20, 20);

        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text').trim() || '#fff';
        ctx.font = '18px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
        ctx.fillText(`${catName} (${percentage}%)`, legendX + 30, legendY);

        legendY += 35;
      });
    }

    let trendHistoryData = null;

    async function loadTrendHistory() {
      if (trendHistoryData) return;
      try {
        const resp = await fetch('data/trending-history.json');
        if (resp.ok) {
          trendHistoryData = await resp.json();
        }
      } catch (e) {
        console.warn('Failed to load trend history:', e);
      }
    }

    function drawTopicTrendChart(topicTitle) {
      const canvas = document.getElementById('trendChart');
      const container = document.getElementById('trendChartContainer');
      const legendEl = document.getElementById('trendLegend');
      if (!canvas || !trendHistoryData || !trendHistoryData.snapshots || trendHistoryData.snapshots.length < 2) {
        if (container) {
          container.innerHTML = `<div class="trend-chart-title">📈 ${t('trendTitle') || '热度趋势'}</div><div class="trend-no-data">${t('trendNoData') || '暂无历史趋势数据，数据将在多次更新后显示'}</div>`;
        }
        return;
      }

      const normalized = topicTitle.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
      const snapshots = trendHistoryData.snapshots;
      const sourceColors = {};
      allData.forEach(s => { sourceColors[s.key] = s.color; });

      const seriesMap = {};
      snapshots.forEach(snap => {
        snap.topics.forEach(topic => {
          const topicNorm = topic.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
          const isMatch = topicNorm === normalized ||
            (normalized.length >= 6 && topicNorm.includes(normalized)) ||
            (topicNorm.length >= 6 && normalized.includes(topicNorm));
          if (isMatch) {
            const key = topic.source;
            if (!seriesMap[key]) seriesMap[key] = [];
            seriesMap[key].push({ date: snap.date, hot: topic.hot });
          }
        });
      });

      const series = Object.entries(seriesMap).map(([source, data]) => ({
        source,
        color: sourceColors[source] || '#888',
        data: data.sort((a, b) => a.date.localeCompare(b.date))
      })).filter(s => s.data.length >= 2);

      if (series.length === 0) {
        if (container) {
          container.innerHTML = `<div class="trend-chart-title">📈 ${t('trendTitle') || '热度趋势'}</div><div class="trend-no-data">${t('trendNoMatch') || '未找到该话题的历史趋势'}</div>`;
        }
        return;
      }

      const ctx = canvas.getContext('2d');
      const width = canvas.width = canvas.offsetWidth * 2;
      const height = canvas.height = 360;
      canvas.style.height = '180px';

      const padding = { top: 30, right: 30, bottom: 50, left: 60 };
      const chartW = width - padding.left - padding.right;
      const chartH = height - padding.top - padding.bottom;

      const allDates = [...new Set(series.flatMap(s => s.data.map(d => d.date)))].sort();
      const allHots = series.flatMap(s => s.data.map(d => d.hot));
      const maxHot = Math.max(...allHots, 1);
      const minHot = 0;

      ctx.clearRect(0, 0, width, height);

      const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim() || '#888';
      const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border').trim() || '#2a2a2a';

      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = padding.top + (chartH / 4) * i;
        ctx.beginPath();
        ctx.moveTo(padding.left, y);
        ctx.lineTo(width - padding.right, y);
        ctx.stroke();

        const val = maxHot - (maxHot / 4) * i;
        ctx.fillStyle = textColor;
        ctx.font = '18px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(val >= 10000 ? (val / 10000).toFixed(1) + 'w' : Math.round(val).toString(), padding.left - 10, y + 6);
      }

      ctx.fillStyle = textColor;
      ctx.font = '16px -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      const dateStep = Math.max(1, Math.floor(allDates.length / 6));
      allDates.forEach((date, i) => {
        if (i % dateStep === 0 || i === allDates.length - 1) {
          const x = padding.left + (i / Math.max(allDates.length - 1, 1)) * chartW;
          ctx.fillText(date.substring(5), x, height - padding.bottom + 25);
        }
      });

      series.forEach(s => {
        ctx.strokeStyle = s.color;
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();

        s.data.forEach((point, i) => {
          const dateIdx = allDates.indexOf(point.date);
          const x = padding.left + (dateIdx / Math.max(allDates.length - 1, 1)) * chartW;
          const y = padding.top + chartH - ((point.hot - minHot) / (maxHot - minHot || 1)) * chartH;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();

        s.data.forEach((point, i) => {
          const dateIdx = allDates.indexOf(point.date);
          const x = padding.left + (dateIdx / Math.max(allDates.length - 1, 1)) * chartW;
          const y = padding.top + chartH - ((point.hot - minHot) / (maxHot - minHot || 1)) * chartH;
          ctx.beginPath();
          ctx.arc(x, y, 5, 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();
        });
      });

      if (legendEl) {
        const sourceNames = {};
        allData.forEach(s => { sourceNames[s.key] = s.source; });
        legendEl.innerHTML = series.map(s =>
          `<div class="trend-legend-item">
            <span class="trend-legend-dot" style="background:${s.color}"></span>
            ${sourceNames[s.source] || s.source}
          </div>`
        ).join('');
      }
    }

    function showShortcuts() {
      const shortcuts = {
        navigation: [
          { keys: ['0'], desc: t('shortcutShowAll') },
          { keys: ['j'], desc: t('shortcutMoveDown') },
          { keys: ['k'], desc: t('shortcutMoveUp') },
          { keys: ['←'], desc: t('shortcutPrevPlatform') },
          { keys: ['→'], desc: t('shortcutNextPlatform') },
        ],
        search: [
          { keys: ['/'], desc: t('shortcutFocusSearch') },
          { keys: ['Esc'], desc: t('shortcutClose'), special: true },
        ],
        view: [
          { keys: ['T'], desc: t('shortcutToggleTheme') },
          { keys: ['F'], desc: t('shortcutFocusMode') },
          { keys: ['?'], desc: t('shortcutShowHelp'), special: true },
        ],
        actions: [
          { keys: ['R'], desc: t('shortcutRandomTopic') },
          { keys: ['B'], desc: t('shortcutBookmarks') },
        ]
      };

      const groupLabels = {
        navigation: t('shortcutsNav'),
        search: t('shortcutsSearch'),
        view: t('shortcutsView'),
        actions: t('shortcutsActions')
      };

      let html = '';
      for (const [group, items] of Object.entries(shortcuts)) {
        html += `<div class="shortcuts-group">
          <div class="shortcuts-group-title">${groupLabels[group]}</div>`;
        for (const item of items) {
          html += `<div class="shortcut-item">
            <div class="shortcut-desc">${item.desc}</div>
            <div class="shortcut-keys">`;
          for (const key of item.keys) {
            html += `<span class="shortcut-key${item.special ? ' special' : ''}">${key}</span>`;
          }
          html += `</div></div>`;
        }
        html += `</div>`;
      }

      document.getElementById('shortcutsContent').innerHTML = html;
      document.getElementById('shortcutsOverlay').classList.add('active');
    }

    function closeShortcuts() {
      document.getElementById('shortcutsOverlay').classList.remove('active');
    }
  </script>
