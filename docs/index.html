<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Hub - 全网热点聚合</title>
  <meta name="description" content="一站式发现知乎、百度、B站、抖音、头条、澎湃、IT之家、少数派等平台热点话题">
  <meta name="keywords" content="热点,热榜,trending,知乎,百度,B站,抖音,头条,澎湃,IT之家,少数派">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%231a1a2e' width='100' height='100' rx='20'/><text x='50' y='65' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif'>TH</text></svg>">
  <style>
    :root {
      --bg: #0f0f0f;
      --bg-card: #1a1a1a;
      --bg-header: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      --bg-input: #222;
      --border: #2a2a2a;
      --border-hover: #444;
      --text: #e0e0e0;
      --text-secondary: #888;
      --text-muted: #666;
      --accent: #48dbfb;
      --accent-red: #ff6b6b;
      --accent-yellow: #feca57;
      --tab-bg: #222;
      --tab-border: #444;
      --tab-active-bg: #333;
      --tab-active-border: #888;
      --rank-bg: #333;
      --rank-color: #888;
      --hover-bg: #222;
      --shadow: rgba(0,0,0,0.3);
    }
    [data-theme="light"] {
      --bg: #f5f5f5;
      --bg-card: #fff;
      --bg-header: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --bg-input: #f0f0f0;
      --border: #e0e0e0;
      --border-hover: #ccc;
      --text: #333;
      --text-secondary: #666;
      --text-muted: #999;
      --accent: #0066ff;
      --accent-red: #e53e3e;
      --accent-yellow: #d69e2e;
      --tab-bg: #fff;
      --tab-border: #ddd;
      --tab-active-bg: #667eea;
      --tab-active-border: #667eea;
      --rank-bg: #f0f0f0;
      --rank-color: #999;
      --hover-bg: #f8f8f8;
      --shadow: rgba(0,0,0,0.08);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
    }
    header {
      background: var(--bg-header);
      padding: 1.5rem 2rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    header h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }
    [data-theme="light"] header h1 {
      background: linear-gradient(90deg, #fff, #e0e0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p { color: rgba(255,255,255,0.7); font-size: 0.85rem; }
    [data-theme="light"] header p { color: rgba(255,255,255,0.85); }
    .header-links { margin-top: 0.5rem; display: flex; gap: 1rem; justify-content: center; align-items: center; }
    .header-links a { color: rgba(255,255,255,0.8); text-decoration: none; font-size: 0.8rem; }
    .header-links a:hover { color: #fff; }
    .theme-toggle {
      background: rgba(255,255,255,0.15);
      border: none;
      color: #fff;
      padding: 0.3rem 0.7rem;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.2s;
    }
    .theme-toggle:hover { background: rgba(255,255,255,0.25); }
    .search-bar {
      padding: 0.75rem 2rem;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: block;
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--bg-input);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-muted); }
    .tabs {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      overflow-x: auto;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .tab-group { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
    .tab-group-label { font-size: 0.7rem; color: var(--text-muted); margin-right: 0.2rem; }
    .tab-divider { width: 1px; height: 18px; background: var(--border-hover); margin: 0 0.4rem; }
    .tab {
      padding: 0.35rem 0.8rem;
      border-radius: 16px;
      cursor: pointer;
      font-size: 0.8rem;
      border: 1px solid var(--tab-border);
      background: var(--tab-bg);
      color: var(--text-secondary);
      transition: all 0.2s;
      white-space: nowrap;
      user-select: none;
    }
    .tab:hover { border-color: var(--text-muted); color: var(--text); }
    .tab.active { background: var(--tab-active-bg); border-color: var(--tab-active-border); color: var(--text); font-weight: 500; }
    .container { max-width: 900px; margin: 1.5rem auto; padding: 0 1rem; }
    .source-section {
      background: var(--bg-card);
      border-radius: 12px;
      margin-bottom: 1.25rem;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 2px 8px var(--shadow);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .source-header {
      padding: 0.8rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 1px solid var(--border);
    }
    .source-icon {
      width: 28px; height: 28px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 0.8rem; color: #fff; flex-shrink: 0;
    }
    .source-name { font-weight: 600; font-size: 0.9rem; }
    .source-count { color: var(--text-muted); font-size: 0.75rem; margin-left: auto; }
    .source-error { color: var(--accent-red); font-size: 0.8rem; }
    .item-list { list-style: none; }
    .item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.6rem 1.25rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .item:hover { background: var(--hover-bg); }
    .item:last-child { border-bottom: none; }
    .item-rank {
      min-width: 22px; height: 22px; border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 600;
      background: var(--rank-bg); color: var(--rank-color);
      flex-shrink: 0; margin-top: 1px;
    }
    .item:nth-child(-n+3) .item-rank { background: var(--accent-red); color: #fff; }
    .item-content { flex: 1; min-width: 0; }
    .item-title { font-size: 0.85rem; line-height: 1.4; word-break: break-word; }
    .item-title a { color: var(--text); text-decoration: none; transition: color 0.15s; }
    .item-title a:hover { color: var(--accent); }
    .item-desc {
      font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .item-hot { font-size: 0.7rem; color: var(--accent-red); white-space: nowrap; flex-shrink: 0; }
    .item-source-tag {
      font-size: 0.65rem; color: var(--text-muted); background: var(--bg-input);
      padding: 0.1rem 0.4rem; border-radius: 8px; margin-left: 0.4rem;
      display: inline-block; vertical-align: middle;
    }
    .item-new-badge {
      font-size: 0.6rem; color: #fff; background: var(--accent-red);
      padding: 0.05rem 0.35rem; border-radius: 6px; margin-left: 0.3rem;
      display: inline-block; vertical-align: middle; font-weight: 600;
    }
    .loading { text-align: center; padding: 3rem; color: var(--text-muted); }
    .skeleton { padding: 0.6rem 1.25rem; }
    .skeleton-line {
      height: 14px; border-radius: 4px; margin-bottom: 0.5rem;
      background: linear-gradient(90deg, var(--bg-input) 25%, var(--border) 50%, var(--bg-input) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    .skeleton-line:nth-child(odd) { width: 80%; }
    .skeleton-line:nth-child(even) { width: 60%; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .refresh-time { text-align: center; color: var(--text-muted); font-size: 0.75rem; padding: 0.75rem; }
    .stats-bar {
      display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;
      padding: 0.5rem 1rem; font-size: 0.75rem; color: var(--text-muted);
    }
    .stats-bar span { display: flex; align-items: center; gap: 0.3rem; }
    .empty-state { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; }
    footer {
      text-align: center; padding: 2rem 1rem; color: var(--text-muted);
      font-size: 0.75rem; border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
    .scroll-top {
      position: fixed; bottom: 2rem; right: 2rem; width: 40px; height: 40px;
      border-radius: 50%; background: var(--accent); color: #fff; border: none;
      cursor: pointer; font-size: 1.2rem; display: none; align-items: center;
      justify-content: center; box-shadow: 0 2px 10px var(--shadow);
      transition: opacity 0.2s, transform 0.2s; z-index: 100;
    }
    .scroll-top:hover { transform: scale(1.1); }
    .scroll-top.visible { display: flex; }
    .share-btn {
      background: rgba(255,255,255,0.15); border: none; color: #fff;
      padding: 0.3rem 0.7rem; border-radius: 12px; cursor: pointer;
      font-size: 0.8rem; transition: background 0.2s;
    }
    .share-btn:hover { background: rgba(255,255,255,0.25); }
    [data-theme="light"] .share-btn { background: rgba(0,0,0,0.1); color: #333; }
    [data-theme="light"] .share-btn:hover { background: rgba(0,0,0,0.15); }
    @media (max-width: 600px) {
      header h1 { font-size: 1.4rem; }
      header p { font-size: 0.75rem; }
      .tabs { padding: 0.5rem 0.75rem; }
      .search-bar { padding: 0.5rem 0.75rem; }
      .item { padding: 0.5rem 0.75rem; }
      .source-header { padding: 0.6rem 0.75rem; }
      .tab { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
      .container { margin: 0.75rem auto; }
      .scroll-top { bottom: 1rem; right: 1rem; width: 36px; height: 36px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Trending Hub</h1>
    <p>全网热点聚合 - 11大平台实时热点</p>
    <div class="header-links">
      <a href="https://github.com/shixingya/trending-hub" target="_blank">GitHub</a>
      <a href="data/feed.xml" target="_blank">RSS</a>
      <button class="share-btn" onclick="shareSite()">分享</button>
      <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">Light</button>
    </div>
  </header>

  <div class="search-bar">
    <input type="text" class="search-input" id="searchInput" placeholder="搜索热点话题... (按 / 聚焦)" oninput="onSearch(this.value)">
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="stats-bar" id="statsBar"></div>

  <div class="container" id="content">
    <div class="source-section">
      <div class="skeleton"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>
      <div class="skeleton"><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-line"></div></div>
    </div>
  </div>
  <div class="refresh-time" id="refreshTime"></div>

  <footer>
    <p>Trending Hub - 仅供学习研究，数据版权归原作者原平台所有</p>
    <p style="margin-top:0.3rem">每2小时自动更新 · 11大平台 · <a href="https://github.com/shixingya/trending-hub">Star on GitHub</a></p>
  </footer>

  <button class="scroll-top" id="scrollTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <script>
    let allData = [];
    let prevData = [];
    let activeSource = 'all';
    let activeCategory = 'all';
    let searchQuery = '';

    const categories = {
      entertainment: { name: '娱乐', keywords: ['明星','演员','导演','电影','电视剧','综艺','娱乐','八卦','演唱会','偶像','粉丝','热搜','恋情','离婚','结婚','出轨','代言','票房','收视','颁奖','选秀','网红','直播','抖音','快手','金鹰','金鸡','百花','奥斯卡','歌手','演员'] },
      military: { name: '军事', keywords: ['军事','军队','武器','战争','国防','导弹','战斗机','航母','坦克','军演','阅兵','部队','军官','士兵','核武','卫星','火箭军','海军','空军','陆军','歼','舰','军机'] },
      sports: { name: '体育', keywords: ['体育','足球','篮球','奥运','比赛','冠军','金牌','世界杯','NBA','CBA','中超','联赛','球队','球员','教练','裁判','进球','得分','马拉松','游泳','乒乓球','亚运','世乒'] },
      tech: { name: '科技', keywords: ['科技','AI','芯片','手机','电脑','苹果','华为','小米','人工智能','5G','互联网','软件','硬件','算法','数据','云计算','区块链','比特币','无人驾驶','机器人','GPT','大模型','OpenAI','iPhone','安卓','芯片'] },
      society: { name: '社会', keywords: ['社会','事件','事故','案件','警方','法院','判决','维权','投诉','曝光','调查','通报','回应','道歉','争议','网友','舆论','诈骗','盗窃','杀人','死亡','去世'] },
      region: { name: '地区', keywords: ['北京','上海','广州','深圳','杭州','成都','武汉','南京','重庆','天津','西安','苏州','长沙','郑州','东莞','青岛','沈阳','宁波','昆明'] },
      finance: { name: '财经', keywords: ['股市','A股','基金','投资','理财','房价','楼市','经济','GDP','央行','降息','加息','汇率','通胀','消费','出口','进口','贸易','关税','企业','上市','融资','IPO'] },
      edu: { name: '教育', keywords: ['高考','考研','大学','教育','学校','学生','老师','教师','考试','录取','志愿','分数','毕业','论文','留学','培训','幼儿园','小学','中学'] }
    };

    function categorize(title) {
      for (const [key, cat] of Object.entries(categories)) {
        for (const kw of cat.keywords) {
          if (title.includes(kw)) return key;
        }
      }
      return 'other';
    }

    function toggleTheme() {
      const body = document.documentElement;
      const btn = document.getElementById('themeToggle');
      if (body.getAttribute('data-theme') === 'light') {
        body.removeAttribute('data-theme');
        btn.textContent = 'Light';
        localStorage.setItem('theme', 'dark');
      } else {
        body.setAttribute('data-theme', 'light');
        btn.textContent = 'Dark';
        localStorage.setItem('theme', 'light');
      }
    }

    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      document.getElementById('themeToggle').textContent = 'Dark';
    }

    function onSearch(query) {
      searchQuery = query.trim().toLowerCase();
      renderContent();
    }

    async function loadTrending() {
      try {
        const res = await fetch('data/trending.json?t=' + Date.now());
        allData = await res.json();
        prevTitleSet = null;
        try {
          const prevRes = await fetch('data/trending-prev.json?t=' + Date.now());
          prevData = await prevRes.json();
        } catch { prevData = []; }
        renderTabs();
        renderStats();
        renderContent();
      } catch (err) {
        document.getElementById('content').innerHTML =
          '<div class="source-section"><div class="source-header"><span class="source-error">加载失败，数据可能尚未生成。GitHub Actions 每2小时自动更新一次。</span></div></div>';
      }
    }

    function renderStats() {
      const total = allData.reduce((sum, s) => sum + s.items.length, 0);
      let newCount = 0;
      if (prevData.length > 0) {
        const ps = buildPrevTitleSet();
        for (const source of allData) {
          for (const item of source.items) {
            if (!ps.has(item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase())) newCount++;
          }
        }
      }
      const bar = document.getElementById('statsBar');
      let html = `<span>共 ${allData.length} 个平台</span><span>${total} 条热点</span>`;
      if (newCount > 0) html += `<span style="color:var(--accent-red)">${newCount} 条新上榜</span>`;
      bar.innerHTML = html;
    }

    function renderTabs() {
      const tabs = document.getElementById('tabs');
      let html = '<div class="tab-group"><span class="tab-group-label">分类</span>';
      html += '<div class="tab active" data-type="category" data-key="all">全部</div>';
      for (const [key, cat] of Object.entries(categories)) {
        html += `<div class="tab" data-type="category" data-key="${key}">${cat.name}</div>`;
      }
      html += '</div><div class="tab-divider"></div><div class="tab-group"><span class="tab-group-label">平台</span>';
      html += '<div class="tab active" data-type="source" data-key="all">全部</div>';
      for (const source of allData) {
        html += `<div class="tab" data-type="source" data-key="${source.key}">${source.icon} ${source.source}<span style="opacity:0.5;font-size:0.7rem;margin-left:2px">${source.items.length}</span></div>`;
      }
      html += '</div>';
      tabs.innerHTML = html;
      tabs.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const type = tab.dataset.type;
          const key = tab.dataset.key;
          tabs.querySelectorAll(`.tab[data-type="${type}"]`).forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          if (type === 'category') activeCategory = key;
          else activeSource = key;
          renderContent();
        });
      });
    }

    function filterItems(items) {
      let filtered = items;
      if (activeCategory !== 'all') {
        filtered = filtered.filter(item => categorize(item.title) === activeCategory);
      }
      if (searchQuery) {
        filtered = filtered.filter(item =>
          item.title.toLowerCase().includes(searchQuery) ||
          (item.description && item.description.toLowerCase().includes(searchQuery))
        );
      }
      return filtered;
    }

    function findCrossPlatformTopics() {
      const titleMap = {};
      for (const source of allData) {
        for (const item of source.items) {
          const normalized = item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
          if (normalized.length < 6) continue;
          if (!titleMap[normalized]) titleMap[normalized] = { title: item.title, sources: [], urls: {}, maxHot: 0 };
          if (!titleMap[normalized].sources.includes(source.source)) {
            titleMap[normalized].sources.push(source.source);
            titleMap[normalized].urls[source.key] = item.url;
            if (item.hot > (titleMap[normalized].maxHot || 0)) titleMap[normalized].maxHot = item.hot;
          }
        }
      }
      return Object.values(titleMap)
        .filter(t => t.sources.length >= 2)
        .sort((a, b) => (b.maxHot || 0) - (a.maxHot || 0))
        .slice(0, 10);
    }

    function getTopHotTopics() {
      const all = [];
      for (const source of allData) {
        for (const item of source.items) {
          if (item.hot) all.push({ ...item, sourceName: source.source, sourceIcon: source.icon, sourceColor: source.color, sourceKey: source.key });
        }
      }
      return all.sort((a, b) => (b.hot || 0) - (a.hot || 0)).slice(0, 20);
    }

    function renderContent() {
      const container = document.getElementById('content');
      const sources = activeSource === 'all'
        ? allData
        : allData.filter(s => s.key === activeSource);

      let html = '';
      if (activeSource === 'all' && activeCategory === 'all' && !searchQuery) {
        const topHot = getTopHotTopics();
        if (topHot.length > 0) {
          html += '<div class="source-section" style="border: 1px solid var(--accent-yellow);">';
          html += '<div class="source-header"><div class="source-icon" style="background:linear-gradient(135deg,#feca57,#ff6b6b)">🔥</div>';
          html += '<span class="source-name">全网热搜榜中榜</span>';
          html += '<span class="source-count">热度 TOP 20</span></div>';
          html += '<ul class="item-list">';
          topHot.forEach((item, i) => {
            html += `<li class="item">
              <span class="item-rank">${i + 1}</span>
              <div class="item-content">
                <div class="item-title"><a href="${item.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
                <span class="item-source-tag" style="background:${item.sourceColor};color:#fff">${item.sourceIcon}</span></div>
                ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ''}
              </div>
              <span class="item-hot">${formatHot(item.hot)}</span>
            </li>`;
          });
          html += '</ul></div>';
        }

        const crossTopics = findCrossPlatformTopics();
        if (crossTopics.length > 0) {
          html += '<div class="source-section" style="border: 1px solid var(--accent-red);">';
          html += '<div class="source-header"><div class="source-icon" style="background:linear-gradient(135deg,#ff6b6b,#feca57)"></div>';
          html += '<span class="source-name">跨平台热搜</span>';
          html += `<span class="source-count">${crossTopics.length} 个话题在多个平台同时上榜</span></div>`;
          html += '<ul class="item-list">';
          crossTopics.forEach((topic, i) => {
            const tags = topic.sources.map(s => {
              const src = allData.find(d => d.source === s);
              return `<span class="item-source-tag" style="background:${src ? src.color : '#555'};color:#fff">${src ? src.icon : s}</span>`;
            }).join(' ');
            const firstUrl = Object.values(topic.urls)[0] || '#';
            html += `<li class="item">
              <span class="item-rank">${i + 1}</span>
              <div class="item-content">
                <div class="item-title"><a href="${firstUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(topic.title)}</a> ${tags}</div>
              </div>
              <span class="item-hot">${topic.sources.length} 平台</span>
            </li>`;
          });
          html += '</ul></div>';
        }
      }

      let totalShown = 0;
      for (const source of sources) {
        const items = filterItems(source.items);
        if (items.length === 0 && (activeCategory !== 'all' || searchQuery)) continue;
        totalShown += items.length;
        html += `<div class="source-section">
          <div class="source-header">
            <div class="source-icon" style="background:${source.color}">${source.icon}</div>
            <span class="source-name">${source.source}</span>
            <span class="source-count">${items.length} 条</span>
            ${source.error ? `<span class="source-error">${source.error}</span>` : ''}
          </div>`;
        if (items.length > 0) {
          html += '<ul class="item-list">';
          const maxItems = Math.min(items.length, 50);
          for (let i = 0; i < maxItems; i++) {
            const item = items[i];
            const url = item.url || '#';
            const title = item.title || '';
            html += `<li class="item">
              <span class="item-rank">${i + 1}</span>
              <div class="item-content">
                <div class="item-title"><a href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(title)}</a>${isNew(title) ? '<span class="item-new-badge">新</span>' : ''}</div>
                ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ''}
              </div>
              ${item.hot ? `<span class="item-hot">${formatHot(item.hot)}</span>` : ''}
            </li>`;
          }
          html += '</ul>';
        } else {
          html += '<div class="empty-state">暂无匹配内容</div>';
        }
        html += '</div>';
      }
      if (!html) {
        html = '<div class="source-section"><div class="empty-state">该分类暂无数据</div></div>';
      }
      container.innerHTML = html;

      const latestFetch = allData.find(s => s.fetchedAt);
      if (latestFetch) {
        document.getElementById('refreshTime').textContent =
          `数据更新于 ${relativeTime(latestFetch.fetchedAt)}`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function formatHot(num) {
      if (num >= 10000) return (num / 10000).toFixed(1) + '万';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return String(num);
    }

    function buildPrevTitleSet() {
      const set = new Set();
      for (const source of prevData) {
        for (const item of source.items) {
          set.add(item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase());
        }
      }
      return set;
    }

    let prevTitleSet = null;
    function isNew(title) {
      if (!prevTitleSet && prevData.length > 0) prevTitleSet = buildPrevTitleSet();
      if (!prevTitleSet) return false;
      return !prevTitleSet.has(title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase());
    }

    function relativeTime(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return '刚刚';
      if (mins < 60) return `${mins} 分钟前`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours} 小时前`;
      return `${Math.floor(hours / 24)} 天前`;
    }

    function updateRefreshTime() {
      const latestFetch = allData.find(s => s.fetchedAt);
      if (latestFetch) {
        document.getElementById('refreshTime').textContent =
          `数据更新于 ${relativeTime(latestFetch.fetchedAt)}`;
      }
    }

    loadTrending();
    setInterval(() => loadTrending(), 10 * 60 * 1000);
    setInterval(() => updateRefreshTime(), 60 * 1000);

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape') {
        document.getElementById('searchInput').blur();
      }
    });

    window.addEventListener('scroll', () => {
      document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 400);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    function shareSite() {
      if (navigator.share) {
        navigator.share({ title: 'Trending Hub - 全网热点聚合', text: '发现全网最热话题', url: location.href });
      } else {
        navigator.clipboard.writeText(location.href).then(() => {
          const btn = document.querySelector('.share-btn');
          btn.textContent = '已复制!';
          setTimeout(() => btn.textContent = '分享', 2000);
        });
      }
    }
  </script>
</body>
</html>
