      region: { name: '地区', keywords: ['北京','上海','广州','深圳','杭州','成都','武汉','南京','重庆','天津','西安','苏州','长沙','郑州','东莞','青岛','沈阳','宁波','昆明'] },
      finance: { name: '财经', keywords: ['股市','A股','基金','投资','理财','房价','楼市','经济','GDP','央行','降息','加息','汇率','通胀','消费','出口','进口','贸易','关税','企业','上市','融资','IPO'] },
      edu: { name: '教育', keywords: ['高考','考研','大学','教育','学校','学生','老师','教师','考试','录取','志愿','分数','毕业','论文','留学','培训','幼儿园','小学','中学'] },
      gaming: { name: '游戏', keywords: ['游戏','原神','王者荣耀','英雄联盟','LOL','吃鸡','绝地求生','Steam','主机','PS5','Xbox','Switch','任天堂','暴雪','网易游戏','手游','网游','电竞','赛事','战队'] },
      auto: { name: '汽车', keywords: ['汽车','车','新能源','电动车','特斯拉','比亚迪','蔚来','小鹏','理想','宝马','奔驰','奥迪','丰田','大众','驾照','4S店','油耗','续航','充电'] },
      health: { name: '健康', keywords: ['健康','医疗','医院','医生','疫苗','病毒','疫情','养生','减肥','健身','睡眠','心理','抑郁','癌症','糖尿病','高血压','中药','西药','保健'] }
    };

    function categorize(title) {
      for (const [key, cat] of Object.entries(categories)) {
        for (const kw of cat.keywords) {
          if (title.includes(kw)) return key;
        }
      }
      return 'other';
    }

    function toggleTheme() {
      const body = document.documentElement;
      const btn = document.getElementById('themeToggle');
      if (body.getAttribute('data-theme') === 'light') {
        body.removeAttribute('data-theme');
        btn.textContent = 'Light';
        localStorage.setItem('theme', 'dark');
      } else {
        body.setAttribute('data-theme', 'light');
        btn.textContent = 'Dark';
        localStorage.setItem('theme', 'light');
      }
    }

    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      document.getElementById('themeToggle').textContent = 'Dark';
    } else if (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: light)').matches) {
      document.documentElement.setAttribute('data-theme', 'light');
      document.getElementById('themeToggle').textContent = 'Dark';
    }

    function onSearch(query) {
      searchQuery = query.trim().toLowerCase();
      renderContent();
    }

    async function loadTrending() {
      try {
        const res = await fetch('data/trending.json?t=' + Date.now());
        allData = await res.json();
        prevTitleSet = null;
        try {
          const prevRes = await fetch('data/trending-prev.json?t=' + Date.now());
          prevData = await prevRes.json();
        } catch { prevData = []; }
        renderTabs();
        renderStats();
        renderContent();
      } catch (err) {
        document.getElementById('content').innerHTML =
          '<div class="source-section"><div class="source-header"><span class="source-error">加载失败，数据可能尚未生成。GitHub Actions 每2小时自动更新一次。</span></div></div>';
      }
    }

    function renderStats() {
      const total = allData.reduce((sum, s) => sum + s.items.length, 0);
      let newCount = 0;
      if (prevData.length > 0) {
        const ps = buildPrevTitleSet();
        for (const source of allData) {
          for (const item of source.items) {
            if (!ps.has(item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase())) newCount++;
          }
        }
      }
      const bar = document.getElementById('statsBar');
      let html = `<span>共 ${allData.length} 个平台</span><span>${total} 条热点</span>`;
      if (newCount > 0) html += `<span style="color:var(--accent-red)">${newCount} 条新上榜</span>`;
      bar.innerHTML = html;
    }

    function renderTabs() {
      const tabs = document.getElementById('tabs');
      const bookmarkCount = getBookmarks().length;
      let html = '<div class="tab-group"><span class="tab-group-label">分类</span>';
      html += `<div class="tab" data-type="source" data-key="bookmarks">☆ 收藏${bookmarkCount > 0 ? `<span style="opacity:0.5;font-size:0.7rem;margin-left:2px">${bookmarkCount}</span>` : ''}</div>`;
      html += '<div class="tab active" data-type="category" data-key="all">全部</div>';
      for (const [key, cat] of Object.entries(categories)) {
        html += `<div class="tab" data-type="category" data-key="${key}">${cat.name}</div>`;
      }
      html += '</div><div class="tab-divider"></div><div class="tab-group"><span class="tab-group-label">平台</span>';
      html += '<div class="tab active" data-type="source" data-key="all">全部</div>';
      for (const source of allData) {
        html += `<div class="tab" data-type="source" data-key="${source.key}">${source.icon} ${source.source}<span style="opacity:0.5;font-size:0.7rem;margin-left:2px">${source.items.length}</span></div>`;
      }
      html += '</div>';
      tabs.innerHTML = html;
      tabs.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          const type = tab.dataset.type;
          const key = tab.dataset.key;
          tabs.querySelectorAll(`.tab[data-type="${type}"]`).forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          if (type === 'category') {
            activeCategory = key;
            activeSource = 'all';
          } else {
            activeSource = key;
            activeCategory = 'all';
          }
          renderContent();
        });
      });
    }

    function filterItems(items) {
      let filtered = items;
      if (activeCategory !== 'all') {
        filtered = filtered.filter(item => categorize(item.title) === activeCategory);
      }
      if (searchQuery) {
        filtered = filtered.filter(item =>
          item.title.toLowerCase().includes(searchQuery) ||
          (item.description && item.description.toLowerCase().includes(searchQuery))
        );
      }
      return filtered;
    }

    function findCrossPlatformTopics() {
      const titleMap = {};
      for (const source of allData) {
        for (const item of source.items) {
          const normalized = item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
          if (normalized.length < 6) continue;
          if (!titleMap[normalized]) titleMap[normalized] = { title: item.title, sources: [], urls: {}, maxHot: 0 };
          if (!titleMap[normalized].sources.includes(source.source)) {
            titleMap[normalized].sources.push(source.source);
            titleMap[normalized].urls[source.key] = item.url;
            if (item.hot > (titleMap[normalized].maxHot || 0)) titleMap[normalized].maxHot = item.hot;
          }
        }
      }
      return Object.values(titleMap)
        .filter(t => t.sources.length >= 2)
        .sort((a, b) => (b.maxHot || 0) - (a.maxHot || 0))
        .slice(0, 10);
    }

    function getTopHotTopics() {
      const all = [];
      for (const source of allData) {
        for (const item of source.items) {
          if (item.hot) all.push({ ...item, sourceName: source.source, sourceIcon: source.icon, sourceColor: source.color, sourceKey: source.key });
        }
      }
      return all.sort((a, b) => (b.hot || 0) - (a.hot || 0)).slice(0, 20);
    }

    function getDailyPicks() {
      const topicMap = {};
      for (const source of allData) {
        for (const item of source.items) {
          const normalized = item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
          if (normalized.length < 6) continue;
          if (!topicMap[normalized]) {
            topicMap[normalized] = {
              title: item.title,
              url: item.url,
              sources: [],
              totalHot: 0,
              maxRank: 999,
              descriptions: []
            };
          }
          const topic = topicMap[normalized];
          if (!topic.sources.includes(source.source)) {
            topic.sources.push(source.source);
            topic.totalHot += item.hot || 0;
            if (item.description && topic.descriptions.length < 2) {
              topic.descriptions.push(item.description);
            }
          }
        }
      }
      return Object.values(topicMap)
        .map(t => ({
          ...t,
          score: t.sources.length * 1000 + (t.totalHot || 0) / 10000
        }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);
    }

    function renderContent() {
      const container = document.getElementById('content');

      if (activeSource === 'bookmarks') {
        const bookmarks = getBookmarks();
        let html = '';
        if (bookmarks.length === 0) {
          html = '<div class="source-section"><div class="empty-state">暂无收藏，点击话题旁的 ☆ 添加收藏</div></div>';
        } else {
          html += '<div class="source-section">';
          html += '<div class="source-header"><div class="source-icon" style="background:var(--accent-yellow)">★</div>';
          html += `<span class="source-name">我的收藏</span><span class="source-count">${bookmarks.length} 条</span></div>`;
          html += '<ul class="item-list">';
          bookmarks.forEach((item, i) => {
            html += `<li class="item">
              <span class="item-rank">${i + 1}</span>
              <div class="item-content">
                <div class="item-title"><a href="${item.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a></div>
                <div style="font-size:0.7rem;color:var(--text-secondary);margin-top:0.2rem">${new Date(item.time).toLocaleString('zh-CN')}</div>
              </div>
              <button class="item-action-btn" onclick="toggleBookmark('${escapeHtml(item.title).replace(/'/g, "\\'")}', '${item.url.replace(/'/g, "\\'")}');renderContent()" title="取消收藏" style="color:var(--accent-yellow)">★</button>
            </li>`;
          });
          html += '</ul></div>';
        }
        container.innerHTML = html;
        return;
      }

      const sources = activeSource === 'all'
        ? allData
        : allData.filter(s => s.key === activeSource);

      let html = '';
      if (activeSource === 'all' && activeCategory === 'all' && !searchQuery) {
        const dailyPicks = getDailyPicks();
        if (dailyPicks.length > 0) {
          html += '<div class="source-section" style="border: 2px solid var(--accent);background:linear-gradient(135deg, rgba(72,219,251,0.05), rgba(255,107,107,0.05));">';
          html += '<div class="source-header"><div class="source-icon" style="background:linear-gradient(135deg,#48dbfb,#ff6b6b)">★</div>';
          html += '<span class="source-name">每日精选</span>';
          html += '<span class="source-count">今日必看 TOP 10</span></div>';
          html += '<ul class="item-list">';
          dailyPicks.forEach((item, i) => {
            const tags = item.sources.slice(0, 3).map(s => {
              const src = allData.find(d => d.source === s);
              return src ? `<span class="item-source-tag" style="background:${src.color};color:#fff">${src.icon}</span>` : '';
            }).join(' ');
            const moreTag = item.sources.length > 3 ? `<span style="font-size:0.7rem;color:var(--text-secondary)">+${item.sources.length - 3}</span>` : '';
            html += `<li class="item" style="border-left: 3px solid ${i < 3 ? 'var(--accent-red)' : 'var(--accent)'};">
              <span class="item-rank" style="background:${i < 3 ? 'linear-gradient(135deg,#ff6b6b,#feca57)' : 'var(--rank-bg)'};color:${i < 3 ? '#fff' : 'var(--rank-color)'}">${i + 1}</span>
              <div class="item-content">
                <div class="item-title"><a href="${item.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a></div>
                <div style="margin-top:0.3rem">${tags}${moreTag}</div>
                ${item.descriptions[0] ? `<div class="item-desc">${escapeHtml(item.descriptions[0])}</div>` : ''}
              </div>
              <span class="item-hot">${item.sources.length} 平台</span>
            </li>`;
          });
          html += '</ul></div>';
        }

        const topHot = getTopHotTopics();
        if (topHot.length > 0) {
          html += '<div class="source-section" style="border: 1px solid var(--accent-yellow);">';
          html += '<div class="source-header"><div class="source-icon" style="background:linear-gradient(135deg,#feca57,#ff6b6b)">🔥</div>';
          html += '<span class="source-name">全网热搜榜中榜</span>';
          html += '<span class="source-count">热度 TOP 20</span></div>';
          html += '<ul class="item-list">';
          topHot.forEach((item, i) => {
            html += `<li class="item">
              <span class="item-rank">${i + 1}</span>
              <div class="item-content">
                <div class="item-title"><a href="${item.url}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
                <span class="item-source-tag" style="background:${item.sourceColor};color:#fff">${item.sourceIcon}</span></div>
                ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ''}
              </div>
              <span class="item-hot">${formatHot(item.hot)}</span>
            </li>`;
          });
          html += '</ul></div>';
        }

        const crossTopics = findCrossPlatformTopics();
        if (crossTopics.length > 0) {
          html += '<div class="source-section" style="border: 1px solid var(--accent-red);">';
          html += '<div class="source-header"><div class="source-icon" style="background:linear-gradient(135deg,#ff6b6b,#feca57)"></div>';
          html += '<span class="source-name">跨平台热搜</span>';
          html += `<span class="source-count">${crossTopics.length} 个话题在多个平台同时上榜</span></div>`;
          html += '<ul class="item-list">';
          crossTopics.forEach((topic, i) => {
            const tags = topic.sources.map(s => {
              const src = allData.find(d => d.source === s);
              return `<span class="item-source-tag" style="background:${src ? src.color : '#555'};color:#fff">${src ? src.icon : s}</span>`;
            }).join(' ');
            const firstUrl = Object.values(topic.urls)[0] || '#';
            html += `<li class="item">
              <span class="item-rank">${i + 1}</span>
              <div class="item-content">
                <div class="item-title"><a href="${firstUrl}" target="_blank" rel="noopener noreferrer">${escapeHtml(topic.title)}</a> ${tags}</div>
              </div>
              <span class="item-hot">${topic.sources.length} 平台</span>
            </li>`;
          });
          html += '</ul></div>';
        }
      }

      let totalShown = 0;
      for (const source of sources) {
        const items = filterItems(source.items);
        if (items.length === 0 && (activeCategory !== 'all' || searchQuery)) continue;
        totalShown += items.length;
        html += `<div class="source-section" data-source-key="${source.key}">
          <div class="source-header" onclick="this.parentElement.classList.toggle('collapsed')">
            <div class="source-icon" style="background:${source.color}">${source.icon}</div>
            <span class="source-name">${source.source}</span>
            <span class="source-count">${items.length} 条</span>
            ${source.error ? `<span class="source-error">${source.error}</span>` : ''}
            <button class="sort-toggle" onclick="sortSource('${source.key}');event.stopPropagation()" title="按热度排序">热度</button>
            <span class="collapse-icon">▼</span>
          </div>`;
        if (items.length > 0) {
          html += '<ul class="item-list">';
          const maxItems = Math.min(items.length, 50);
          for (let i = 0; i < maxItems; i++) {
            const item = items[i];
            const url = item.url || '#';
            const title = item.title || '';
            html += `<li class="item">
              <span class="item-rank">${i + 1}</span>
              <div class="item-content">
                <div class="item-title"><a href="${url}" target="_blank" rel="noopener noreferrer">${escapeHtml(title)}</a>${isNew(title) ? '<span class="item-new-badge">新</span>' : ''}</div>
                ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ''}
              </div>
              <div class="item-actions">
                <button class="item-action-btn" onclick="showTopicDetail('${escapeHtml(title).replace(/'/g, "\\'")}');event.stopPropagation()" title="跨平台详情">🔍</button>
                <button class="item-action-btn" onclick="toggleBookmark('${escapeHtml(title).replace(/'/g, "\\'")}', '${url.replace(/'/g, "\\'")}');event.stopPropagation()" title="收藏">☆</button>
                <button class="item-action-btn" onclick="copyLink('${url.replace(/'/g, "\\'")}');event.stopPropagation()" title="复制链接">📋</button>
              </div>
              ${item.hot ? `<span class="item-hot">${formatHot(item.hot)}</span>` : ''}
            </li>`;
          }
          html += '</ul>';
        } else {
          html += '<div class="empty-state">暂无匹配内容</div>';
        }
        html += '</div>';
      }
      if (!html) {
        html = '<div class="source-section"><div class="empty-state">该分类暂无数据</div></div>';
      }
      container.innerHTML = html;

      const latestFetch = allData.find(s => s.fetchedAt);
      if (latestFetch) {
        document.getElementById('refreshTime').textContent =
          `数据更新于 ${relativeTime(latestFetch.fetchedAt)}`;
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function showTopicDetail(title) {
      const normalized = title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
      const matches = [];
      for (const source of allData) {
        for (const item of source.items) {
          const itemNorm = item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase();
          if (itemNorm === normalized || (normalized.length >= 6 && itemNorm.includes(normalized)) || (itemNorm.length >= 6 && normalized.includes(itemNorm))) {
            matches.push({ source: source.source, key: source.key, icon: source.icon, color: source.color, title: item.title, url: item.url, hot: item.hot, description: item.description });
          }
        }
      }
      const modal = document.getElementById('topicModal');
      document.getElementById('modalTitle').textContent = title;
      let body = '';
      if (matches.length <= 1) {
        body = '<div class="modal-section"><div class="modal-section-title">仅在单个平台发现</div>';
        if (matches.length === 1) {
          const m = matches[0];
          body += `<div class="modal-platform-item">
            <div class="modal-platform-icon" style="background:${m.color}">${m.icon}</div>
            <div class="modal-platform-name">${m.source}</div>
            ${m.hot ? `<div class="modal-platform-hot">${formatHot(m.hot)}</div>` : ''}
            <a class="modal-platform-link" href="${m.url}" target="_blank">查看</a>
          </div>`;
        }
        body += '</div>';
      } else {
        body = `<div class="modal-section"><div class="modal-section-title">在 ${matches.length} 个平台同时上榜</div>`;
        matches.sort((a, b) => (b.hot || 0) - (a.hot || 0));
        for (const m of matches) {
          body += `<div class="modal-platform-item">
            <div class="modal-platform-icon" style="background:${m.color}">${m.icon}</div>
            <div class="modal-platform-name">${m.source}${m.description ? ` <span style="color:var(--text-muted);font-size:0.75rem">${escapeHtml(m.description)}</span>` : ''}</div>
            ${m.hot ? `<div class="modal-platform-hot">${formatHot(m.hot)}</div>` : ''}
            <a class="modal-platform-link" href="${m.url}" target="_blank">查看</a>
          </div>`;
        }
        body += '</div>';
      }
      document.getElementById('modalBody').innerHTML = body;
      modal.classList.add('active');
    }

    function closeModal() {
      document.getElementById('topicModal').classList.remove('active');
    }

    function showMorningBrief() {
      if (allData.length === 0) return;
      const now = new Date();
      const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
      const dayStr = `星期${weekdays[now.getDay()]}`;

      const picks = getDailyPicks();
      const topBySource = allData.filter(s => s.items.length > 0).map(s => ({
        source: s.source,
        icon: s.icon,
        color: s.color,
        top3: s.items.slice(0, 3)
      }));

      let body = `<div style="text-align:center;margin-bottom:1rem">
        <div style="font-size:1.2rem;font-weight:600">☀️ 早安·今日热点速览</div>
        <div style="font-size:0.8rem;color:var(--text-muted);margin-top:0.3rem">${dateStr} ${dayStr}</div>
      </div>`;

      if (picks.length > 0) {
        body += '<div class="modal-section"><div class="modal-section-title">🔥 全网必看</div>';
        picks.slice(0, 5).forEach((item, i) => {
          body += `<div style="padding:0.4rem 0;border-bottom:1px solid var(--border);font-size:0.9rem">
            <span style="color:var(--accent-red);font-weight:600;margin-right:0.5rem">${i + 1}</span>
            <a href="${item.url}" target="_blank" style="color:var(--text-primary);text-decoration:none">${escapeHtml(item.title)}</a>
            <span style="font-size:0.7rem;color:var(--text-muted);margin-left:0.5rem">${item.sources.length}平台</span>
          </div>`;
        });
        body += '</div>';
      }

      body += '<div class="modal-section"><div class="modal-section-title">📊 各平台 TOP 3</div>';
      topBySource.forEach(s => {
        body += `<div style="margin-bottom:0.6rem">
          <div style="font-size:0.8rem;font-weight:600;margin-bottom:0.2rem">
            <span style="display:inline-block;width:18px;height:18px;border-radius:4px;background:${s.color};color:#fff;text-align:center;line-height:18px;font-size:0.6rem;margin-right:0.3rem">${s.icon}</span>
            ${s.source}
          </div>
          ${s.top3.map((item, i) => `<div style="font-size:0.75rem;color:var(--text-secondary);padding-left:1.5rem">${i + 1}. <a href="${item.url}" target="_blank" style="color:var(--text-secondary);text-decoration:none">${escapeHtml(item.title)}</a></div>`).join('')}
        </div>`;
      });
      body += '</div>';

      body += `<div style="text-align:center;margin-top:1rem">
        <button class="share-btn" onclick="copyMorningBrief()" style="background:var(--accent);color:#fff;padding:0.4rem 1rem;border-radius:8px;border:none;cursor:pointer">📋 复制早报文本</button>
      </div>`;

      document.getElementById('modalTitle').textContent = '每日早报';
      document.getElementById('modalBody').innerHTML = body;
      document.getElementById('topicModal').classList.add('active');
    }

    function copyMorningBrief() {
      const now = new Date();
      const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      const picks = getDailyPicks();
      let text = `☀️ 早安·今日热点速览 (${dateStr})\n\n`;
      text += '🔥 全网必看:\n';
      picks.slice(0, 5).forEach((item, i) => {
        text += `${i + 1}. ${item.title} (${item.sources.length}平台)\n`;
      });
      text += '\n📊 各平台 TOP 3:\n';
      allData.filter(s => s.items.length > 0).forEach(s => {
        text += `\n【${s.source}】\n`;
        s.items.slice(0, 3).forEach((item, i) => {
          text += `  ${i + 1}. ${item.title}\n`;
        });
      });
      text += '\n查看更多: https://shixingya.github.io/trending-hub/';
      navigator.clipboard.writeText(text).then(() => {
        const btn = event.target;
        const orig = btn.textContent;
        btn.textContent = '✓ 已复制';
        setTimeout(() => btn.textContent = orig, 2000);
      });
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if (focusMode) { toggleFocusMode(); return; }
        closeModal();
      }
    });

    function formatHot(num) {
      if (num >= 10000) return (num / 10000).toFixed(1) + '万';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
      return String(num);
    }

    function buildPrevTitleSet() {
      const set = new Set();
      for (const source of prevData) {
        for (const item of source.items) {
          set.add(item.title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase());
        }
      }
      return set;
    }

    let prevTitleSet = null;
    function isNew(title) {
      if (!prevTitleSet && prevData.length > 0) prevTitleSet = buildPrevTitleSet();
      if (!prevTitleSet) return false;
      return !prevTitleSet.has(title.replace(/[^\w\u4e00-\u9fff]/g, '').toLowerCase());
    }

    function relativeTime(dateStr) {
      const diff = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return '刚刚';
      if (mins < 60) return `${mins} 分钟前`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours} 小时前`;
      return `${Math.floor(hours / 24)} 天前`;
    }

    function updateRefreshTime() {
      const latestFetch = allData.find(s => s.fetchedAt);
      if (latestFetch) {
        document.getElementById('refreshTime').textContent =
          `数据更新于 ${relativeTime(latestFetch.fetchedAt)}`;
      }
    }

    loadTrending();
    setInterval(() => loadTrending(), 10 * 60 * 1000);
    setInterval(() => updateRefreshTime(), 60 * 1000);

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
      if (e.key === 'Escape') {
        document.getElementById('searchInput').blur();
      }
      if ((e.key === 'j' || e.key === 'k') && document.activeElement.tagName !== 'INPUT') {
        const links = Array.from(document.querySelectorAll('.item-title a'));
        if (links.length === 0) return;
        const current = document.activeElement.closest('.item');
        let idx = current ? links.indexOf(current.querySelector('a')) : -1;
        if (e.key === 'j') idx = Math.min(idx + 1, links.length - 1);
        else idx = Math.max(idx - 1, 0);
        links[idx].focus();
        links[idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    });

    window.addEventListener('scroll', () => {
      document.getElementById('scrollTop').classList.toggle('visible', window.scrollY > 400);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    function shareSite() {
      const total = allData.reduce((sum, s) => sum + s.items.length, 0);
      const text = `🔥 全网热点聚合 - ${total} 条热点\n\n` +
        allData.filter(s => s.items.length > 0).slice(0, 5).map(s =>
          `${s.source} TOP3:\n${s.items.slice(0, 3).map((item, i) => `  ${i + 1}. ${item.title}`).join('\n')}`
        ).join('\n\n') +
        `\n\n查看更多: ${location.href}`;
      if (navigator.share) {
        navigator.share({ title: 'Trending Hub - 全网热点聚合', text, url: location.href });
      } else {
        navigator.clipboard.writeText(text).then(() => {
          const btns = document.querySelectorAll('.share-btn');
          const btn = btns[btns.length - 1];
          if (btn) { const orig = btn.textContent; btn.textContent = '✓ 已复制'; setTimeout(() => btn.textContent = orig, 2000); }
        });
      }
    }

    function randomTopic() {
      if (allData.length === 0) return;
      const sources = allData.filter(s => s.items.length > 0);
      const source = sources[Math.floor(Math.random() * sources.length)];
      const item = source.items[Math.floor(Math.random() * source.items.length)];
      if (item && item.url) window.open(item.url, '_blank');
    }

    function exportData(format) {
      if (allData.length === 0) return;
      const date = new Date().toISOString().split('T')[0];
      let content = '';
      let filename = '';
      let mimeType = '';

      if (format === 'md') {
        filename = `trending-${date}.md`;
        mimeType = 'text/markdown';
        content = `# 全网热点聚合 - ${date}\n\n`;
        content += `> 生成时间: ${new Date().toLocaleString('zh-CN')}\n\n`;
        for (const source of allData) {
          if (source.items.length === 0) continue;
          content += `## ${source.source} (${source.items.length} 条)\n\n`;
          source.items.slice(0, 20).forEach((item, i) => {
            content += `${i + 1}. [${item.title}](${item.url})`;
            if (item.hot) content += ` - ${formatHot(item.hot)}`;
            content += '\n';
          });
          content += '\n';
        }
      } else if (format === 'csv') {
        filename = `trending-${date}.csv`;
        mimeType = 'text/csv';
        content = '\uFEFF平台,排名,标题,链接,热度\n';
        for (const source of allData) {
          if (source.items.length === 0) continue;
          source.items.slice(0, 20).forEach((item, i) => {
            const title = `"${(item.title || '').replace(/"/g, '""')}"`;
            const url = `"${(item.url || '').replace(/"/g, '""')}"`;
            const hot = item.hot || '';
            content += `${source.source},${i + 1},${title},${url},${hot}\n`;
          });
        }
      }

      const blob = new Blob([content], { type: mimeType + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function copyLink(url) {
      navigator.clipboard.writeText(url).then(() => {
        const btn = event.target;
        const orig = btn.textContent;
        btn.textContent = '✓';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    function getBookmarks() {
      try {
        return JSON.parse(localStorage.getItem('trending-bookmarks') || '[]');
      } catch { return []; }
    }

    function toggleBookmark(title, url) {
      const bookmarks = getBookmarks();
      const idx = bookmarks.findIndex(b => b.title === title);
      const btn = event.target;
      if (idx >= 0) {
        bookmarks.splice(idx, 1);
        btn.textContent = '☆';
        btn.style.color = '';
      } else {
        bookmarks.push({ title, url, time: Date.now() });
        btn.textContent = '★';
        btn.style.color = 'var(--accent-yellow)';
      }
      localStorage.setItem('trending-bookmarks', JSON.stringify(bookmarks));
    }

    function sortSource(key) {
      const source = allData.find(s => s.key === key);
      if (!source) return;
      if (sortedSources.has(key)) {
        sortedSources.delete(key);
      } else {
        sortedSources.add(key);
        source.items.sort((a, b) => (b.hot || 0) - (a.hot || 0));
      }
      renderContent();
      const btn = document.querySelector(`[data-source-key="${key}"] .sort-toggle`);
      if (btn) btn.classList.toggle('active', sortedSources.has(key));
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === '/') { e.preventDefault(); document.querySelector('.search-bar input')?.focus(); }
      if (e.key === 't' || e.key === 'T') { toggleTheme(); }
      if (e.key === '0') { switchSource('all'); }
      if (e.key === 'Escape') { closeModal(); }
    });

    let focusMode = false;
    function toggleFocusMode() {
      focusMode = !focusMode;
      document.body.classList.toggle('focus-mode', focusMode);
      const btn = document.getElementById('focusBtn');
      if (btn) btn.textContent = focusMode ? '退出' : '专注';
      if (focusMode) {
        const sections = document.querySelectorAll('.source-section');
        sections.forEach(s => s.classList.remove('focus-active'));
        const firstVisible = document.querySelector('.source-section');
        if (firstVisible) firstVisible.classList.add('focus-active');
      }
    }

    document.addEventListener('click', (e) => {
      if (focusMode && e.target.closest('body::before')) {
        toggleFocusMode();
      }
    });
  </script>
</body>
</html>
